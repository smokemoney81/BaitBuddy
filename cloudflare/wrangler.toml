# Cloudflare Worker (Front-Door) fuer BaitBuddy.
# Deploy:  npx wrangler deploy --config cloudflare/wrangler.toml
# Voraussetzung: zuvor `npm run build` (erzeugt dist/), Backend-Container laeuft
# unter BACKEND_URL, und das Secret CRON_SECRET ist gesetzt
# (`npx wrangler secret put CRON_SECRET --config cloudflare/wrangler.toml`).
#
# Fuer den reinen statischen Frontend-Deploy per Cloudflare Pages existiert
# weiterhin das Pages-Skelett in ../wrangler.toml (pages_build_output_dir).
# Dieser Worker ist die vereinheitlichte Variante: statische Assets + /api-Proxy
# + Cron in einem Deployment.

name = "baitbuddy"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Statische SPA aus dem Vite-Build. _headers/_redirects in dist/ werden vom
# Assets-Handler ausgewertet; not_found_handling liefert die SPA-index.html.
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cron Triggers (UTC) — identisch zu vercel.json > crons.
[triggers]
crons = ["0 3 * * *", "0 2 * * *", "0 1 * * *", "0 0 1 * *"]

# Nicht-geheime Variablen. BACKEND_URL zeigt auf das Express-Backend
# (Cloudflare Container oder Node-Origin). CRON_SECRET wird als Secret gesetzt,
# NICHT hier.
[vars]
BACKEND_URL = "https://api.baitbuddy.example"
