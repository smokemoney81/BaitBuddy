# Cloudflare Worker (Front-Door) — BaitBuddy Production Deploy
# Vollständiger Deploy-Override für Vercel. Alle Infrastruktur zentralisiert auf
# Cloudflare: Frontend (SPA), Backend (Worker + später Container), Crons, KV/Redis.
#
# Deploy-Kanäle:
#   1. GitHub Actions: push main → npx wrangler deploy (nutzt diese Datei)
#   2. Manuell: npx wrangler deploy --env production
#
# Environment: production (Standard, kein Fallback auf staging nötig)
#
# Secrets werden im Cloudflare Dashboard gesetzt oder via Env-Datei:
#   wrangler secret put CRON_SECRET
#   wrangler secret put BACKEND_CONTAINER_SECRET  (später für Container)
# Vars können hier definiert oder im Dashboard überschrieben werden.

name = "baitbuddy"
main = "cloudflare/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# --- Build-Befehl für Cloudflare Workers Builds (Git-Integration) ---
# Cloudflare führt diesen Befehl aus, bevor es den Worker deployt.
# Erzeugt dist/ mit SPA + _headers + _redirects.
[build]
command = "npm install --legacy-peer-deps && npm run build"

# --- Statische Assets: Vite-Build (dist/) ---
# _headers: Cache-Policy pro Path
# _redirects: SPA-Fallback (/* -> /index.html)
# not_found_handling: Alle 404 gehen zu index.html (React Router)
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# --- Cron Triggers (UTC) ---
# Jeweils 4 Admin-Endpunkte:
#   0 3 * * * (03:00) -> /api/admin/premium/check-expiry
#   0 2 * * * (02:00) -> /api/admin/events/auto-archive
#   0 1 * * * (01:00) -> /api/admin/rewards/auto-activate
#   0 0 1 * * (00:00 1. des Monats) -> /api/admin/leaderboards/monthly/generate
# Muss synchron bleiben mit: vercel.json (Referenz), docker/cron/crontab
[triggers]
crons = ["0 3 * * *", "0 2 * * *", "0 1 * * *", "0 0 1 * *"]

# --- Environment Variables (Non-Secret) ---
# BACKEND_URL: Basis-URL des Express-Backends
#   Übergangslösung: `https://api.catchgbt.com` existiert nicht (keine DNS-
#   Auflösung) — der Worker proxyte damit jede /api/*-Anfrage gegen eine tote
#   Origin (Cloudflare-530, u. a. Login/Registrierung komplett down). Bis die
#   Cloudflare-Container-Migration steht, zeigt BACKEND_URL auf die echte,
#   erreichbare Vercel-Produktions-URL.
#   Ziel: Cloudflare Container URL (nach Paid Plan Migration)
# DOMAIN: Produktions-Domain, für Logging/Verification
[vars]
BACKEND_URL = "https://bait-buddy.vercel.app"
DOMAIN = "catchgbt.com"

# --- Rate-Limit Store (optional) ---
# Falls Upstash Redis/Vercel KV gesetzt, wird es für instanzübergreifende
# Rate-Limits genutzt. Ohne KV_URL greift In-Memory-Fallback im Backend.
# Kann im Dashboard als Secret gesetzt werden: wrangler secret put KV_URL
# [secrets]
# KV_URL = "redis://..."  # nur wenn Redis/Upstash konfiguriert
