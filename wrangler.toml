# Cloudflare Worker (Front-Door) fuer BaitBuddy — autoritative Deploy-Config.
# Wird von der Cloudflare "Workers Builds"-Git-Integration (Projekt "baitbuddy")
# gelesen. Zuvor stand hier eine Pages-artige Config (pages_build_output_dir),
# die zum Workers-Build nicht passte und sofort fehlschlug.
#
# Cloudflare-Build-Einstellungen (im Dashboard zu setzen):
#   Build command:  npm install --legacy-peer-deps && npm run build
#   Deploy command: npx wrangler deploy   (nutzt diese Datei)
# Variablen/Secret am Worker:
#   BACKEND_URL (Var)  — Basis-URL des Express-Backends. Zeigt auf das neue
#                        Vercel-Projekt (Konto ssbedburg); spaeter Container-URL.
#                        Im Dashboard als Worker-Variable ueberschreibbar.
#   CRON_SECRET (Secret) — identisch zum Backend, aktiviert die Cron-Triggers
#
# Der reine statische Frontend-Deploy per Pages ist damit abgeloest; die SPA wird
# vom Worker ueber das Assets-Binding ausgeliefert, /api/* wird ans Backend
# geproxyt (SSE unveraendert durchgereicht). Details: docs/CLOUDFLARE_MIGRATION.md

name = "baitbuddy"
main = "cloudflare/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Statische SPA aus dem Vite-Build (dist/). _headers/_redirects in dist/ werden
# ausgewertet; not_found_handling liefert die SPA-index.html (Client-Routing).
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cron Triggers (UTC) — identisch zu vercel.json > crons und docker/cron/crontab.
[triggers]
crons = ["0 3 * * *", "0 2 * * *", "0 1 * * *", "0 0 1 * *"]

# Nicht-geheime Variable. BACKEND_URL zeigt auf das Express-Backend. Aktuell das
# neue Vercel-Projekt (Konto ssbedburg), damit /api sofort funktioniert; der
# Cloudflare-Container folgt spaeter. Der exakte Produktions-Alias ist im neuen
# Vercel-Dashboard zu verifizieren und ggf. als Worker-Variable zu ueberschreiben.
[vars]
BACKEND_URL = "https://bait-buddy-ssbedburg-2361s-projects.vercel.app"
