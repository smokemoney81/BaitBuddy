# Cloudflare Worker (Front-Door + Backend-Container) fuer BaitBuddy — autoritative
# Deploy-Config. Wird von der Cloudflare "Workers Builds"-Git-Integration bzw. von
# `npx wrangler deploy` gelesen.
#
# Architektur (Details: docs/CLOUDFLARE_MIGRATION.md):
#   - Statische SPA (Vite-Build dist/) wird vom Worker ueber das Assets-Binding
#     ausgeliefert; _headers/_redirects in dist/ steuern Cache & SPA-Fallback.
#   - /api/* wird an das Express-Backend geroutet, das als Cloudflare Container
#     (docker/backend.Dockerfile) laeuft und ueber das Durable-Object-Binding
#     BACKEND angesprochen wird. SSE wird unveraendert durchgereicht.
#   - Die vier Crons laufen als Cloudflare Cron Triggers und rufen die
#     Admin-Endpunkte im Container mit CRON_SECRET auf.
#
# Cloudflare-Build-Einstellungen (Workers Builds):
#   Build command:  npm install --legacy-peer-deps && npm run build
#   Deploy command: npx wrangler deploy   (nutzt diese Datei, baut + pusht das Image)
#
# Am Worker zu setzen (Dashboard bzw. `wrangler secret put`):
#   CRON_SECRET (Secret, identisch zum Backend) — aktiviert die Cron-Triggers.
#   Backend-Secrets als Secrets/Vars, die der Worker an den Container reicht
#   (siehe backendEnv() in cloudflare/worker.js): SUPABASE_URL,
#   SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY, STRIPE_SECRET_KEY,
#   STRIPE_WEBHOOK_SECRET, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON, ALLOWED_ORIGINS, ...

name = "baitbuddy"
main = "cloudflare/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Statische SPA aus dem Vite-Build (dist/). _headers/_redirects in dist/ werden
# ausgewertet; not_found_handling liefert die SPA-index.html (Client-Routing).
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cron Triggers (UTC) — identisch zu vercel.json > crons und docker/cron/crontab.
[triggers]
crons = ["0 3 * * *", "0 2 * * *", "0 1 * * *", "0 0 1 * *"]

# Backend (Express) als Cloudflare Container. `wrangler deploy` baut das Image
# aus docker/backend.Dockerfile und pusht es. Der Build-Context ist das Repo-Root
# ("."), weil das Dockerfile aus backend/ und scripts/ kopiert.
[[containers]]
class_name = "Backend"
image = "./docker/backend.Dockerfile"
image_build_context = "."
instance_type = "basic"
max_instances = 3

# Durable Object, ueber das der Worker die Container-Instanz anspricht.
[[durable_objects.bindings]]
name = "BACKEND"
class_name = "Backend"

# SQLite-basierte DO-Migration (Pflicht fuer Container-Klassen).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Backend"]
