name: Build Android

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (muss hoeher sein als der zuletzt in der Play Console hochgeladene)'
        required: false
        default: '31'
      version_name:
        description: 'Android versionName'
        required: false
        default: '2.117899.1'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # contents: write für das GitHub-Release mit der Direkt-Download-APK.
    permissions:
      contents: write
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # NDK + CMake für den lokalen KI-Buddy (llama.cpp, android/app/src/main/cpp).
      # Versionen müssen zu ndkVersion/cmake.version in android/app/build.gradle passen.
      - name: Install Android SDK platform 36, NDK and CMake
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Install deps
        run: npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # Gradle-Wrapper steht bereits auf 8.9 (siehe gradle-wrapper.properties).
      # Dieser sed stellt nur sicher, dass ein versehentliches Downgrade durch
      # andere Tools rückgängig gemacht wird – er ist idempotent.
      - name: Ensure Gradle 8.9
        run: |
          sed -i 's|gradle-[0-9.]*-all.zip|gradle-8.9-all.zip|' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|gradle-[0-9.]*-bin.zip|gradle-8.9-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo "--- gradle-wrapper.properties ---"
          cat android/gradle/wrapper/gradle-wrapper.properties

      # FIX 2: frischer Gradle-Cache (alter Cache aus den fehlgeschlagenen Laeufen war beschaedigt)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-v2-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-v2-

      # Debug-APK zum lokalen Testen per Sideload (aus dem früheren build-apk.yml
      # übernommen, damit beim Zusammenführen keine Fähigkeit verloren geht).
      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: baitbuddy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Signierte Release-.aab fuer den Play Store. versionCode/versionName kommen
      # beim manuellen Dispatch aus den Workflow-Inputs; bei Tag-Builds (push)
      # greifen die Defaults aus android/app/build.gradle. Wichtig: appVersionCode/
      # appVersionName sind echte Gradle-Properties, die build.gradle auswertet —
      # die frueheren android.injected.version.*-Properties wurden vom AGP ignoriert
      # (das AAB hatte dadurch immer versionCode 1).
      - name: Build Release AAB (signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          cd android && ./gradlew bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PappVersionCode=${{ github.event.inputs.version_code || '31' }} \
            -PappVersionName=${{ github.event.inputs.version_name || '2.117899.1' }}

      - name: Upload Release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: baitbuddy-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # Signierte Release-APK zum Direkt-Download: Der Button „Android-App
      # installieren“ auf der Login-Seite (src/lib/androidApk.js) liest das
      # neueste GitHub-Release und lädt dessen Asset `baitbuddy.apk`. Gleicher
      # Schlüssel wie das AAB. Ohne Keystore wird bewusst nichts veröffentlicht —
      # eine Debug-APK gehört nicht in öffentliche Hände.
      - name: Build Release APK (signed)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          cd android && ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -PappVersionCode=${{ github.event.inputs.version_code || '31' }} \
            -PappVersionName=${{ github.event.inputs.version_name || '2.117899.1' }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/baitbuddy.apk"

      - name: Publish APK as GitHub Release
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-{0}', github.event.inputs.version_code || '31') }}
          name: ${{ github.event.inputs.version_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: baitbuddy.apk
          make_latest: true
          body: |
            Android-App zum direkten Installieren (APK). Download auch über
            „Android-App installieren“ auf der Login-Seite. Beim ersten Mal fragt
            Android, ob dein Browser Apps installieren darf.
