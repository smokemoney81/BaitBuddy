name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:

# Ein PR-Branch loeste bisher zwei Laeufe aus (push + pull_request) und jeder
# neue Commit stapelte weitere obendrauf. Push nur noch fuer main, und ein
# laufender Check wird beim naechsten Push desselben Refs abgebrochen.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # npm ci statt npm install: installiert exakt die Versionen aus dem
      # Lockfile und schlaegt fehl, wenn package.json und Lockfile auseinander
      # laufen. `npm install` haette den Drift still repariert — dann testet CI
      # einen Dependency-Baum, den niemand committet hat.
      - name: Install deps
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install backend deps
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: backend

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        timeout-minutes: 15

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # Browser-Binaries sind gross; ohne Cache laedt jeder Lauf sie neu.
      # Der Schluessel haengt an der Playwright-Version aus dem Lockfile.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Das Runner-Image hat Googles Chrome-Apt-Repo konfiguriert. Dessen Index
      # lieferte am 2026-09-09 reproduzierbar einen "Hash Sum mismatch", woran
      # das `apt-get update` INNERHALB von `--with-deps` scheiterte (Exit 100):
      # der blockierende E2E-Gate stand damit fuer jeden PR still, obwohl kein
      # einziger Test lief und die Browser-Binaries bereits aus dem Cache
      # wiederhergestellt waren. Playwright braucht dieses Repo nicht — seine
      # System-Pakete kommen aus den Ubuntu-Quellen. `rm -f` bleibt still, falls
      # eine kuenftige Image-Version die Datei nicht mehr mitbringt.
      - name: Remove unrelated third-party apt sources
        run: sudo rm -f /etc/apt/sources.list.d/*google*

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Traces und Screenshots der fehlgeschlagenen Tests — ohne sie ist ein
      # roter E2E-Lauf in CI kaum zu diagnostizieren.
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
