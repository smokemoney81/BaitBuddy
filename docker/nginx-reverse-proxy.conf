# Reverse Proxy für öffentliche Erreichbarkeit von catchgbt.com
# SSL/TLS Terminierung + Proxy zu Backend:3000
# Lädt Let's Encrypt Zertifikate nach Certbot-Aufbau

upstream backend {
    server backend:3000;
    keepalive 32;
}

# ============================================================================
# HTTP → HTTPS Redirect + ACME Challenge (Let's Encrypt)
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name catchgbt.com www.catchgbt.com;

    # ACME-Challenge für Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Alles andere → HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ============================================================================
# HTTPS Server (SSL/TLS)
# ============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name catchgbt.com www.catchgbt.com;

    # SSL/TLS Zertifikate (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/catchgbt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catchgbt.com/privkey.pem;

    # SSL/TLS Sicherheit
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Client-Upload-Limit: 12MB (Fangfotos als Base64)
    client_max_body_size 12m;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    gzip_min_length 1024;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header 'X-Frame-Options' 'DENY' always;
    add_header 'X-Content-Type-Options' 'nosniff' always;
    add_header 'X-XSS-Protection' '1; mode=block' always;
    add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
    add_header 'Permissions-Policy' 'camera=(), microphone=(), geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)' always;
    add_header 'Strict-Transport-Security' 'max-age=31536000; includeSubDomains; preload' always;
    # frame-src/worker-src: Clerk-Anmeldung (Bot-Schutz-Frame von Cloudflare Turnstile, Web-Worker)
    add_header 'Content-Security-Policy' "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https:; frame-src 'self' https://challenges.cloudflare.com; worker-src 'self' blob:; frame-ancestors 'none';" always;

    # =========================================================================
    # CORS Headers (Vercel Frontend + Mobile Apps)
    # =========================================================================
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Accept' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Max-Age' '86400' always;

    # Handle CORS preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # =========================================================================
    # API Proxy → Backend:3000
    # =========================================================================
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Upgrade $http_upgrade;

        # Timeouts (KI-Buddy SSE: bis zu 5 Min Streaming)
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # SSE & Streaming: kein Buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
    }

    # Health Check (zum Monitoring)
    location /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # =========================================================================
    # Fallback: 404
    # =========================================================================
    location / {
        return 404;
    }
}

# www → non-www Redirect (optional)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.catchgbt.com;

    ssl_certificate /etc/letsencrypt/live/catchgbt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catchgbt.com/privkey.pem;

    return 301 https://catchgbt.com$request_uri;
}
